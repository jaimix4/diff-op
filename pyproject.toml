[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffop"
version = "0.1.0"
description = "Velocity-dependent diffusion-convection transport models for 2D2V Gkeyll edge/SOL simulations"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
